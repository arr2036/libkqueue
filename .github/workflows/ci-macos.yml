name: CI tests macOS

on:
  push:
    branches:
      - master
    paths:
      - 'test/*'
      - 'tools/test-stack-dump.sh'
      - '.github/workflows/ci-macos.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'test/*'
      - 'tools/test-stack-dump.sh'
      - '.github/workflows/ci-macos.yml'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      iterations:
        description: "Soak iteration count (default 50)"
        required: false
        default: "50"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  macos-tests:
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 60 || 10 }}
    runs-on: macos-latest
    name: "macOS tests"
    steps:
    - uses: actions/checkout@v5

    - name: Build and configure
      run: |
        cd test
        cmake .
        make

    - name: Gated tests
      if: always()
      run: |
        GATED=$(./test/libkqueue-test --list-gated=macos 2>/dev/null) || true
        {
          printf '## Gated on macos\n'
          printf '| Suite | Test | Reason |\n| --- | --- | --- |\n'
          if [ -n "$GATED" ]; then
            printf '%s\n' "$GATED" | awk -F'\t' '{gsub(/\|/,"&#124;",$3); print "| "$1" | "$2" | "$3" |"}'
          else
            printf '_none_\n'
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: libkqueue test suite
      env:
        KQUEUE_DEBUG: yes
      run: |
        mkdir -p "$RUNNER_TEMP/kqlogs"
        ./test/libkqueue-test \
          --watchdog-timeout=120 \
          --watchdog-cmd="${{ github.workspace }}/tools/test-stack-dump.sh" \
          --log-file="$RUNNER_TEMP/kqlogs/kq-%{t}-%{s}.log" \
          -n ${{ github.event_name == 'workflow_dispatch' && inputs.iterations || (github.event_name == 'schedule' && 50 || 1) }}

    - name: Upload soak logs on failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: test-log
        path: ${{ runner.temp }}/kqlogs
        retention-days: 3
        if-no-files-found: ignore
